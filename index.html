<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>东东项目官网</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* 全局滚动优化 - 强制GPU加速 + 平滑滚动 */
        body {
            min-height: 100vh;
            /* 固定背景，减少滚动重绘 */
            background: radial-gradient(circle at 10% 20%, rgba(180, 210, 245, 0.5), rgba(210, 230, 255, 0.3)),
                        linear-gradient(145deg, #eef4fc 0%, #e2ebf6 100%);
            background-attachment: fixed;
            font-family: -apple-system, 'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', system-ui, BlinkMacSystemFont, sans-serif;
            padding: 24px 20px 100px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            /* 关键：平滑滚动 + 触摸滚动优化 */
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }

        /* 主容器 */
        .glass-container {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 28px;
            /* 启用独立合成层 */
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
        }

        /* ========= 全局玻璃卡片样式 - 平衡模糊与性能 ========= 
           降低blur强度至16px，依旧通透但大幅减少GPU负担 */
        .glass-card, .profile-card, .section, .device-info, .footer-glass {
            background: rgba(245, 250, 255, 0.68);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border-radius: 34px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05), inset 0 0.5px 0 rgba(255,255,255,0.7);
            border: 0.5px solid rgba(255,255,255,0.5);
            /* 强制开启硬件加速 */
            transform: translate3d(0, 0, 0);
            -webkit-transform: translate3d(0, 0, 0);
            will-change: transform;
            transition: transform 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1), box-shadow 0.2s ease;
        }

        /* hover仅在非触摸设备上生效，避免移动端卡顿 */
        @media (hover: hover) and (pointer: fine) {
            .glass-card:hover, .btn-glass:hover {
                transform: translateY(-2px);
                box-shadow: 0 12px 28px rgba(0, 0, 0, 0.08), inset 0 1px 0 rgba(255,255,255,0.7);
            }
        }

        /* 头部区域 */
        .header-glass {
            background: rgba(235, 245, 255, 0.55);
            backdrop-filter: blur(18px) saturate(200%);
            -webkit-backdrop-filter: blur(18px) saturate(200%);
            border-radius: 48px;
            padding: 16px 28px;
            border: 0.5px solid rgba(255,255,255,0.7);
            box-shadow: 0 6px 16px -6px rgba(0,0,0,0.05), inset 0 1px 0 rgba(255,255,255,0.7);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            transform: translateZ(0);
        }

        .logo h1 {
            font-size: 28px;
            font-weight: 590;
            background: linear-gradient(135deg, #1f4870, #2c5a82);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }

        .status-indicator {
            background: rgba(235, 245, 255, 0.55);
            backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 6px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 0.5px solid rgba(255,255,255,0.5);
        }

        .status-value {
            font-weight: 590;
            font-size: 18px;
            color: #2a6b9e;
        }

        .status-label {
            font-size: 13px;
            color: #3a5a7a;
        }

        /* 响应式布局 */
        .two-columns {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 28px;
        }

        @media (max-width: 880px) {
            .two-columns {
                grid-template-columns: 1fr;
                gap: 22px;
            }
            body {
                padding: 18px 16px 90px;
            }
            .header-glass {
                flex-direction: column;
                text-align: center;
            }
        }

        /* 侧边栏卡片 */
        .profile-card {
            padding: 26px 20px;
            text-align: center;
            background: rgba(240, 248, 255, 0.7);
            backdrop-filter: blur(16px);
        }

        .avatar-glass {
            width: 108px;
            height: 108px;
            margin: 0 auto 18px;
            background: rgba(210, 230, 250, 0.5);
            border-radius: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 14px rgba(0,0,0,0.04), inset 0 1px 1px rgba(255,255,255,0.8);
            border: 1px solid rgba(255,255,255,0.6);
            overflow: hidden;
        }

        .avatar-glass img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-name {
            font-size: 26px;
            font-weight: 620;
            background: linear-gradient(135deg, #1f4870, #2f6491);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .profile-role {
            font-size: 15px;
            color: #2a6b9e;
            font-weight: 490;
            margin: 8px 0 12px;
            background: rgba(42, 107, 158, 0.12);
            display: inline-block;
            padding: 4px 16px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
        }

        .profile-desc {
            font-size: 14px;
            color: #4a627a;
            line-height: 1.4;
        }

        /* 右侧功能卡片 */
        .section, .device-info {
            background: rgba(240, 248, 255, 0.65);
            backdrop-filter: blur(16px);
            border-radius: 38px;
            padding: 18px 22px;
            transform: translateZ(0);
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
            padding-bottom: 10px;
            border-bottom: 0.5px solid rgba(255,255,255,0.7);
        }

        .icon-blur {
            width: 44px;
            height: 44px;
            background: rgba(190, 220, 250, 0.6);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #2a6b9e;
            box-shadow: inset 0 0.5px 1px rgba(255,255,255,0.7), 0 2px 6px rgba(0,0,0,0.02);
        }

        .section-title {
            font-size: 20px;
            font-weight: 590;
            color: #1f4870;
        }

        /* 按钮网格 - 减少内部滤镜层级 */
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
        }

        .btn-glass {
            background: rgba(245, 250, 255, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
            transition: transform 0.15s ease, background 0.2s;
            border: 0.5px solid rgba(255,255,255,0.6);
            box-shadow: 0 2px 8px rgba(0,0,0,0.02), inset 0 1px 0 rgba(255,255,255,0.6);
            transform: translateZ(0);
            cursor: pointer;
        }

        .btn-glass:active {
            transform: scale(0.98);
            background: rgba(235, 245, 255, 0.88);
        }

        .btn-icon-glass {
            width: 44px;
            height: 44px;
            background: rgba(190, 218, 245, 0.5);
            backdrop-filter: blur(6px);
            border-radius: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #2a6b9e;
        }

        .btn-content {
            flex: 1;
        }

        .btn-title {
            font-weight: 590;
            font-size: 16px;
            color: #1f4870;
        }

        .btn-desc {
            font-size: 13px;
            color: #5a7896;
            margin-top: 2px;
        }

        .badge-glass {
            background: rgba(42, 107, 158, 0.2);
            backdrop-filter: blur(6px);
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 500;
            color: #2a6b9e;
            border: 0.3px solid rgba(255,255,255,0.5);
        }

        /* 设备信息 */
        .device-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 16px;
        }
        .device-title {
            font-weight: 590;
            font-size: 18px;
            color: #1f4870;
        }
        .device-status {
            background: rgba(42, 107, 158, 0.2);
            border-radius: 26px;
            padding: 4px 12px;
            font-size: 13px;
            color: #2a6b9e;
        }
        .device-details {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .device-item {
            flex: 1;
            min-width: 100px;
        }
        .device-label {
            font-size: 12px;
            color: #6a85a0;
        }
        .device-value {
            font-weight: 560;
            font-size: 17px;
            color: #1f4870;
            margin-top: 4px;
        }

        /* 悬浮玻璃底栏 - 极致轻量化 */
        .glass-bottom-bar {
            position: fixed;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%) translateZ(0);
            width: calc(100% - 32px);
            max-width: 520px;
            background: rgba(235, 245, 255, 0.8);
            backdrop-filter: blur(24px) saturate(200%);
            -webkit-backdrop-filter: blur(24px) saturate(200%);
            border-radius: 44px;
            padding: 10px 20px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border: 0.5px solid rgba(255,255,255,0.7);
            box-shadow: 0 6px 18px rgba(0,0,0,0.06), inset 0 0.5px 0 rgba(255,255,255,0.8);
            z-index: 1000;
            gap: 8px;
            will-change: transform;
        }

        .bottom-link {
            color: #3a6b92;
            text-decoration: none;
            font-size: 14px;
            font-weight: 490;
            padding: 8px 12px;
            border-radius: 32px;
            transition: background 0.2s;
            background: rgba(255,255,255,0.3);
            backdrop-filter: blur(4px);
        }
        .bottom-link:active {
            background: rgba(255,255,255,0.6);
            transform: scale(0.96);
        }

        /* 弹窗轻量化 */
        .glass-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(100, 130, 170, 0.2);
            backdrop-filter: blur(10px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.2s ease, visibility 0s linear 0.2s;
        }
        .glass-modal-overlay.active {
            visibility: visible;
            opacity: 1;
            transition: opacity 0.2s ease, visibility 0s linear 0s;
        }
        .glass-modal {
            background: rgba(248, 252, 255, 0.96);
            backdrop-filter: blur(28px);
            border-radius: 48px;
            width: 300px;
            max-width: 80vw;
            padding: 24px 22px;
            text-align: center;
            box-shadow: 0 20px 36px rgba(0,0,0,0.1), inset 0 1px 1px rgba(255,255,255,0.6);
            border: 0.5px solid rgba(255,255,255,0.7);
            transform: scale(0.96);
            transition: transform 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }
        .active .glass-modal {
            transform: scale(1);
        }
        .glass-modal h3 {
            font-size: 21px;
            font-weight: 590;
            margin-bottom: 10px;
            color: #1f4870;
        }
        .glass-modal p {
            font-size: 15px;
            color: #4a6988;
            margin: 10px 0 18px;
            line-height: 1.4;
        }
        .modal-btn {
            background: rgba(42, 107, 158, 0.2);
            backdrop-filter: blur(6px);
            border: none;
            padding: 10px 24px;
            border-radius: 44px;
            font-size: 16px;
            font-weight: 510;
            color: #2a6b9e;
            cursor: pointer;
            transition: background 0.15s;
        }
        .modal-btn:active {
            background: rgba(42, 107, 158, 0.35);
        }

        /* 页脚轻量化 */
        footer {
            background: transparent;
            margin-top: 20px;
            text-align: center;
        }
        .footer-glass {
            background: rgba(235, 245, 255, 0.55);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 12px 20px;
            display: inline-block;
            width: auto;
            margin: 0 auto;
            text-align: center;
        }
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 6px;
            flex-wrap: wrap;
        }
        .footer-link {
            color: #4a7396;
            text-decoration: none;
            font-size: 13px;
            padding: 4px 10px;
            border-radius: 30px;
            transition: background 0.15s;
        }
        .footer-link:active {
            background: rgba(42,107,158,0.1);
        }

        /* 滚动条美观 */
        ::-webkit-scrollbar {
            width: 4px;
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(42,107,158,0.25);
            border-radius: 20px;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="glass-container">
    <!-- 头部 -->

        </div>
        <div class="status-indicator">

    <div class="two-columns">

            <div class="avatar-glass">
                <img src="http://129.204.47.214:8888/down/KArdGzt5EbmX.jpg" alt="东东" loading="lazy" onerror="this.style.display='none'; this.parentElement.innerText='东东'; this.parentElement.style.fontSize='42px'; this.parentElement.style.fontWeight='600'; this.parentElement.style.background='rgba(42,107,158,0.2)';">

        <h3 id="modalTitle"></h3>
        <p id="modalText"></p>
        <button class="modal-btn" id="closeModalBtn">了解</button>
    </div>
</div>

<script>
    (function() {
        // 运行天数 (轻量更新)
        const startDate = new Date(2026, 9, 10);
        function updateUptime() {
            const now = new Date();
            const diffDays = Math.floor((now - startDate) / (1000 * 60 * 60 * 24));
            const uptimeElem = document.getElementById('uptimeDisplay');
            if (uptimeElem) uptimeElem.innerText = diffDays >= 0 ? diffDays + '天' : '0天';
        }
        updateUptime();
        setInterval(updateUptime, 3600000);
        
        // 设备信息 (一次性获取)
        const deviceElem = document.getElementById('deviceTypeLabel');
        const netElem = document.getElementById('netStatusLabel');
        const batteryElem = document.getElementById('batteryValueLabel');
        const statusBadge = document.getElementById('deviceStatusBadge');

        function detectDevice() {
            const ua = navigator.userAgent;
            if (/iPhone|iPad|iPod/.test(ua)) return 'iOS 设备';
            if (/Android/.test(ua)) return 'Android 设备';
            if (/Windows/.test(ua)) return 'Windows 电脑';
            if (/Mac/.test(ua)) return 'Mac 设备';
            return '跨平台设备';
        }
        if (deviceElem) deviceElem.innerText = detectDevice();

        function updateNetwork() {
            const online = navigator.onLine;
            netElem.innerText = online ? '在线' : '离线';
            if (statusBadge) {
                statusBadge.innerText = online ? '在线' : '离线';
                statusBadge.style.background = online ? "rgba(42,107,158,0.2)" : "rgba(180,80,80,0.2)";
            }
        }
        updateNetwork();
        window.addEventListener('online', updateNetwork);
        window.addEventListener('offline', updateNetwork);

        if ('getBattery' in navigator) {
            navigator.getBattery().then(battery => {
                const updateBattery = () => {
                    batteryElem.innerText = Math.round(battery.level * 100) + '%';
                };
                updateBattery();
                battery.addEventListener('levelchange', updateBattery);
            }).catch(() => { batteryElem.innerText = '100%'; });
        } else {
            batteryElem.innerText = '100%';
        }

        // 弹窗逻辑
        const modalOverlay = document.getElementById('glassModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalText = document.getElementById('modalText');
        const closeModalBtn = document.getElementById('closeModalBtn');

        function showGlassDialog(title, message) {
            modalTitle.innerText = title;
            modalText.innerText = message;
            modalOverlay.classList.add('active');
        }

        function hideModal() {
            modalOverlay.classList.remove('active');
        }

        closeModalBtn.addEventListener('click', hideModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) hideModal();
        });

        // 底部条款
        document.getElementById('termsBtn')?.addEventListener('click', (e) => {
            e.preventDefault();

        document.getElementById('privacyBtn')?.addEventListener('click', (e) => {

        });
        document.getElementById('disclaimerBtn')?.addEventListener('click', (e) => {

        });

        // 底栏导航
        const homeLink = document.getElementById('homeLink');
        const navChannel = document.getElementById('navChannelLink');

        homeLink?.addEventListener('click', (e) => {

            window.open('https://t.me/DDMHNB', '_blank', 'noopener');

        });

        // 按钮轻触反馈（无额外性能开销）
        document.querySelectorAll('.btn-glass, .bottom-link, .footer-link').forEach(btn => {
            btn.addEventListener('touchstart', function() {
                this.style.transform = 'scale(0.98)';
            }, { passive: true });
            btn.addEventListener('touchend', function() {
                this.style.transform = '';
            });
            btn.addEventListener('touchcancel', function() {

        });
